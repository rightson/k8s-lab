<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" role="img" aria-labelledby="title desc">
<title id="title">Container restart versus Pod replacement</title><desc id="desc">A process exit preserves Pod UID and increments container restarts. Pod deletion produces a new Pod UID through ReplicaSet reconciliation. Both lose volatile process state.</desc>
<rect width="640" height="690" fill="#ffffff"/>
<g font-family="sans-serif" fill="#182838" text-anchor="middle">
<text x="320" y="42" font-size="26">Which identity changes?</text>
<rect x="55" y="75" width="530" height="205" rx="12" fill="#e8f1ff" stroke="#32649a"/>
<text x="320" y="112" font-size="24">Process exits</text>
<text x="320" y="153" font-size="22">Pod UID A stays</text>
<text x="320" y="191" font-size="22">kubelet restarts the container</text>
<text x="320" y="229" font-size="22">restartCount increases</text>
<text x="320" y="260" font-size="19">New process / counter starts at 0</text>
<rect x="55" y="315" width="530" height="205" rx="12" fill="#ecf7ee" stroke="#287449"/>
<text x="320" y="352" font-size="24">Managed Pod is deleted</text>
<text x="320" y="393" font-size="22">Pod UID A disappears</text>
<text x="320" y="431" font-size="22">ReplicaSet creates Pod UID B</text>
<text x="320" y="469" font-size="22">Scheduler assigns a node</text>
<text x="320" y="500" font-size="19">New process / counter starts at 0</text>
<text x="320" y="568" font-size="21">Replacing execution preserves no business data</text>
<text x="320" y="606" font-size="19">Expected semantics, not cluster observations</text>
<text x="617" y="672" text-anchor="end" font-size="10">Scott Yo-Ru Chen · 2026-10-15</text>
</g><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#182838" i]{fill:#ced8e1}[fill="#e8f1ff" i]{fill:#142034}[fill="#ecf7ee" i]{fill:#1e2b20}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#287449" i]{stroke:#60c88d}[stroke="#32649a" i]{stroke:#78a4d3}}</style>
</svg>

